<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Lets sharp's SVG renderer resolve the self-hosted woff2 faces when generating
  the OG image, so it uses the same type as the site rather than a system fallback.
  Only used by scripts/generate-assets.mjs — not part of the Astro build.
-->
<fontconfig>
  <dir prefix="default">../public/fonts</dir>
  <cachedir prefix="default">../node_modules/.cache/fontconfig</cachedir>
</fontconfig>
